name: "📖 这段教程可以更清楚"
description: "找不到入口、图片看不清或步骤过时，都可以告诉我们。"
title: "[文档] "
labels: [documentation, needs-triage]
body:
  - type: markdown
    attributes:
      value: "下载入口、教程步骤、AI 配置和文字错误都可以反馈。只需提供公开文档位置和卡住的地方，不需要粘贴自己的配置或求职资料。"
  - type: input
    id: page
    attributes:
      label: 哪一页、哪一步？
      placeholder: "例如快速上手第 3 步，或贴文档链接"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 哪句话或哪张图让你困惑？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 建议怎样说明（可选）
      placeholder: "例如希望补一张入口截图，或说明应该选择哪个文件。"
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: "反馈中没有 API Key、实际 AI 请求、个人求职资料或未打码截图。"
          required: true
