name: "💡 我有个想法 / Feature idea"
description: "从真实场景出发；中文或 English 均可，不必准备完整方案。Describe the problem, not a complete design."
title: "[建议] "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: "中文或 English 均可。先说使用场景，不必设计完整方案；请先搜索已有建议，使用虚构示例。English ideas are welcome. Explain your use case with synthetic examples; never post private records or keys."
  - type: textarea
    id: problem
    attributes:
      label: 现在什么事情比较麻烦？ / What is difficult today?
      placeholder: "我每次……都需要……，尤其在……的时候。"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 希望怎样改善？ / Proposed improvement (optional)
      description: "暂时没有解决方案也欢迎反馈。You do not need a solution to report a problem."
      placeholder: "如果能……，我就可以……"
  - type: dropdown
    id: frequency
    attributes:
      label: 这个场景多久遇到一次？ / Frequency (optional)
      options: [几乎每天 / Daily, 每周几次 / Weekly, 偶尔 / Occasionally, 尚未使用但觉得有帮助 / Not yet used]
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法或参考 / Workaround or reference (optional)
      description: "可以分享公开链接，请勿上传他人的机密材料或未经授权的图片。"
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认 / Before submitting
      options:
        - label: "建议中没有私人求职资料、联系方式或密钥。No private job-search data, contact details or API keys are included."
          required: true
